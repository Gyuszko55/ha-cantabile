<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29b6f6"/>
      <stop offset="1" stop-color="#1a4fc4"/>
    </linearGradient>
    <linearGradient id="cdoboz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3edff"/>
    </linearGradient>
    <radialGradient id="ckup" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#5aa8ff"/>
      <stop offset=".55" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#173f9e"/>
    </radialGradient>
    <filter id="carnyek" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b2a6b" flood-opacity=".38"/>
    </filter>
    <!-- egy hangfal (a koordináta-rendszer bal felső sarkától) -->
    <g id="hangfal">
      <g filter="url(#carnyek)"><rect x="0" y="0" width="136" height="236" rx="22" fill="url(#cdoboz)"/></g>
      <!-- magassugárzó -->
      <circle cx="68" cy="52" r="24" fill="#d5e3fb"/>
      <circle cx="68" cy="52" r="15" fill="url(#ckup)"/>
      <circle cx="63" cy="47" r="4" fill="#fff" opacity=".7"/>
      <!-- mélysugárzó -->
      <circle cx="68" cy="152" r="54" fill="#d5e3fb"/>
      <circle cx="68" cy="152" r="46" fill="url(#ckup)"/>
      <circle cx="68" cy="152" r="30" fill="none" stroke="#9cc4ff" stroke-width="3" opacity=".55"/>
      <circle cx="68" cy="152" r="14" fill="#0f2f7a"/>
      <circle cx="63" cy="147" r="4" fill="#fff" opacity=".55"/>
      <!-- reflexnyílás -->
      <rect x="44" y="214" width="48" height="8" rx="4" fill="#c4d6f5"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#cbg)"/>
  <!-- hanghullámok: a hangfalakból kifelé -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M 86 266 A 44 44 0 0 0 86 342" stroke-width="8" opacity=".9"/>
    <path d="M 62 244 A 70 70 0 0 0 62 364" stroke-width="7" opacity=".5"/>
    <path d="M 426 266 A 44 44 0 0 1 426 342" stroke-width="8" opacity=".9"/>
    <path d="M 450 244 A 70 70 0 0 1 450 364" stroke-width="7" opacity=".5"/>
  </g>
  <use href="#hangfal" transform="translate(98 168) scale(.9)"/>
  <use href="#hangfal" transform="translate(292 168) scale(.9)"/>
  <!-- hangjegy fent középen -->
  <g fill="#fff" transform="translate(-9 6)">
    <path d="M 238 64 L 292 52 L 292 112 A 16 13 0 1 1 280 100 L 280 78 L 250 85 L 250 124 A 16 13 0 1 1 238 112 Z"/>
  </g>
</svg>
